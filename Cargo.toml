[package]
name = "diff-rs"
edition = "2024"

[dependencies]
rand = { version = "0.10", features = ["chacha"] }
rand_distr = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tenferro-cpu = "0.5"
tenferro-einsum = "0.5"
tenferro-ext-sparse = { git = "https://github.com/tensor4all/tenferro-rs.git" }
tenferro-runtime = "0.5"
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs.git" }
